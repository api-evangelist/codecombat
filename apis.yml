aid: codecombat
name: CodeCombat
description: >-
  CodeCombat is a game-based computer science platform where students learn to
  code by playing a real programming game, writing Python or JavaScript to
  control heroes through levels. Its Partner API (a Fern-generated REST API at
  https://codecombat.com/api, secured with HTTP Basic authentication) lets
  learning platforms and school districts provision and manage users, create and
  administer classrooms, enroll students in courses, grant and shorten
  licenses and Home subscriptions, link OAuth2 SSO identities, manage clans, and
  pull playtime, license, and per-member progress statistics. CodeCombat is
  backed by a16z and Y Combinator and publishes official Node, Python, Java, and
  Go SDKs plus a Postman collection generated from its public OpenAPI
  description.
